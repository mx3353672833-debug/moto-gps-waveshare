  <rect width="1400" height="720" rx="34" fill="#081218"/><text x="70" y="75" class="t h">“箭头永远朝前”的实现原理</text><text x="70" y="112" class="t s">车辆箭头固定 12 点方向，路线与道路几何按融合航向反向旋转</text>
