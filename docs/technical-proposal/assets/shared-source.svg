<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75cff4"/></marker><style>.t{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#f4fafc}.h{font-size:36px;font-weight:700}.s{font-size:20px;fill:#b9c8d0}.k{font-size:23px;font-weight:700}.n{font-size:18px;fill:#d2dde2}.a{fill:#15332d;stroke:#55c6a9;stroke-width:2}.b{fill:#14252e;stroke:#4c7182;stroke-width:2}.c{fill:#352a1b;stroke:#e6a647;stroke-width:2}.l{stroke:#75cff4;stroke-width:4;fill:none;marker-end:url(#a)}.tag{font-size:17px;font-weight:700;fill:#7ed8b9}</style></defs>
  <rect width="1400" height="760" rx="34" fill="#081218"/><text x="70" y="75" class="t h">网页与固件同源，而不是“照着重写”</text><text x="70" y="112" class="t s">共享核心保持原样；平台输入输出通过薄适配层切换</text>
  <rect x="430" y="175" width="540" height="300" rx="30" class="a"/><text x="480" y="225" class="t k">A 级：直接共享的 C / C++ 源码</text><text x="480" y="275" class="t n">- NavCore：路线匹配、推进、偏航、重算状态机</text><text x="480" y="315" class="t n">- RouteBundle 数据结构与坐标边界</text><text x="480" y="355" class="t n">- LVGL 四页界面、字体、图标与 RGB565 资源</text><text x="480" y="395" class="t n">- 固定时钟、输入夹具、golden frame 与单元测试</text><text x="480" y="442" class="t tag">浏览器运行的就是以后进入 ESP32 的核心</text>
  <rect x="70" y="535" width="500" height="145" rx="24" class="b"/><text x="110" y="580" class="t k">B 级：Web 适配层</text><text x="110" y="620" class="t n">Geolocation · fetch · 浏览器存储 · 触摸</text><text x="110" y="652" class="t n">WASM / SDL 显示驱动</text>
  <rect x="830" y="535" width="500" height="145" rx="24" class="b"/><text x="870" y="580" class="t k">B 级：ESP32 板级适配层</text><text x="870" y="620" class="t n">GNSS / I2C · HTTPS · NVS · CST820</text><text x="870" y="652" class="t n">CO5300 QSPI + DMA 显示驱动</text>
  <path d="M570 535L650 475" class="l"/><path d="M830 535L750 475" class="l"/>
  <rect x="70" y="175" width="270" height="230" rx="24" class="c"/><text x="105" y="222" class="t k">C 级：仅 Web</text><text x="105" y="266" class="t n">目的地搜索</text><text x="105" y="302" class="t n">完整调试面板</text><text x="105" y="338" class="t n">轨迹回放 / 故障注入</text><text x="105" y="374" class="t n">开发日志</text><path d="M340 291H430" class="l"/>
  <rect x="1060" y="175" width="270" height="230" rx="24" class="c"/><text x="1095" y="222" class="t k">迁移时必须调整</text><text x="1095" y="266" class="t n">360 到 466 布局</text><text x="1095" y="302" class="t n">Framebuffer / DMA</text><text x="1095" y="338" class="t n">实体 FPC 与触摸方向</text><text x="1095" y="374" class="t n">性能和内存预算</text><path d="M970 291H1060" class="l"/>
</svg>
